      - "empaque"
      - "recyclable packaging"

  # Container-unit vocabulary; the corpus pairs them directly ('a can or a bottle) sold' / 'una lata o una botella').
  # risk: Rationale counts are substring-inflated and misleading: whole-word verification gives bottle 128 (not 397 — the rest is "bottler/bottling", since KOF is a bottler) and lata 9 (not 158 — inflated by Sp…
