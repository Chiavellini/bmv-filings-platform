  # KOF/FEMSA report performance by product category using 'sparkling' vs 'still' beverages (and ES 'refrescos'/'bebidas').
  # risk: The bare category alias "bebida(s)" fires on any beverage query — including a sugar-FREE /
  #   sugar-TAX / reduced-sugar policy query ("bebidas sin azucar ... impuesto"), whose intent is the
  #   health/excise sense, NOT beverage-category performance. Left ungated, the category expansion drags
  #   in raw-material sugar-COST passages ("higher sugar prices"), the documented wrong-sense leak. A
  #   suppress-only gate vetoes the whole concept when a sugar-free/tax signal is present; ordinary
  #   beverage-category queries (refresco carbonatado, bebida gaseosa) carry no such signal and still fire.
  beverage_category:
    aliases:
      - "soft drink"
      - "soft drinks"
      - "sparkling"
      - "sparkling beverage"
      - "sparkling beverages"
      - "still beverage"
      - "still beverages"
      - "carbonated"
      - "non-carbonated"
      - "carbonated soft drinks"
      - "refresco"
      - "refrescos"
      - "bebida"
      - "bebidas"
      - "bebidas carbonatadas"
      - "bebidas no carbonatadas"
