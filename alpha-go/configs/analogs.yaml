# Search-only ANALOG dictionary — domain/material vocabulary for query expansion.
#
# Same shape as configs/metric_search.yaml (concepts -> aliases), kept SEPARATE and merged
# only into keyword search / trends / highlighting (src/index/keyword_index.py::_dictionary),
# never into extraction. A search for any alias of a concept also matches the others so
# "pet" surfaces "plastic"/"resin"/"packaging" (AlphaSense "Smart Synonyms" style).
#
# Mechanics/caveats:
# - Matching is whole-word, case-insensitive, accent-stripped; aliases are normalized on load.
# - A bare single-token alias fires on ANY query containing that word — per-concept 'risk:'
#   notes below flag the tokens with cross-domain leakage (kept: rare in this corpus).
# - Generated by the alpha-go-analogs workflow (5 domain miners -> adversarial verify/trim,
#   36 groups kept), grounded in the bimbo/walmex/femsa/kof/tbbb corpus.
#
# Per-concept sharpening schema (all OPTIONAL; missing => backward-compatible defaults):
#   weight:         concept-level default alias weight (default 1.0).
#   alias_weights:  {alias: weight} overrides — demote risky bare tokens (e.g. "PET": 0.5) so
#                   they land in the low-weight ("weak") fusion band instead of flooding results.
#                   A weight >= 0.75 is "strong"; below is "weak" (fused at a lower boost).
#   gate:           polysemy guard that encodes the 'risk:' note into executable disambiguation:
#     guarded_aliases:  aliases that must NOT expand on their own (bare risky tokens).
#     require_any:      co-terms; a guarded alias expands only if one is also in the query.
#     suppress_if_any:  other-sense signals that VETO the whole concept (veto beats corroboration).
#   These are read by src/index/keyword_index.py::_analog_meta (search-only; never extraction).
version: 1

concepts:
  # Flagship material family.
  # risk: Bare "PET" is a common English word (pet/pets/pet food/pet care) — with whole-word case-insensitive matching, any query containing "pet" would over-expand into resin/plastic passages.
  pet_resin_plastic:
    aliases:
      - "PET"
      - "PET resin"
      - "resin"
      - "resina"
      - "plastic"
      - "plastics"
      - "plástico"
      - "paraxylene"
      - "paraxileno"
      - "monoethylene glycol"
      - "MEG"
    alias_weights:
      "PET": 0.5          # bare 3-letter token; only expands when corroborated (weak band)
      "MEG": 0.5          # bare acronym
    gate:
      guarded_aliases: ["PET", "MEG"]
      require_any:
        - "resin"
        - "plastic"
        - "plastics"
        - "plástico"
        - "bottle"
        - "bottles"
        - "botella"
        - "packaging"
        - "empaque"
        - "envase"
        - "beverage"
        - "bebida"
        - "paraxylene"
        - "monoethylene"
        - "recycled"
      suppress_if_any:    # the pet-animal sense — must never pull resin/plastic
        - "pet food"
        - "pet foods"
        - "pet care"
        - "pet store"
        - "pet stores"
        - "pet supplies"
        - "pets"
        - "mascota"
        - "mascotas"
        - "dog"
        - "dogs"
        - "cat"
        - "cats"
        - "veterinary"

  # The corpus consistently frames PET and sweeteners under the umbrella 'raw material costs' / 'materias primas' — the dominant input-cost phrasing (125+ 'raw material costs' hits).
  # risk: "sugar" is a common English word: the whole-word matcher will fire raw_materials expansion on unrelated product/health/tax queries ("sugar-sweetened beverages" excise tax, "sugar-free", "no-sugar" lau…
  raw_materials:
    aliases:
      - "raw material"
      - "raw materials"
      - "raw material costs"
      - "materia prima"
      - "materias primas"
      - "sweetener"
      - "sweeteners"
      - "sugar"
      - "azúcar"
      - "edulcorante"
      - "edulcorantes"
    alias_weights:
      "sugar": 0.5        # common word; only the input-cost sense should expand
      "azúcar": 0.5
    gate:
      guarded_aliases: ["sugar", "azúcar"]
      require_any:        # cost/commodity context that marks the input-cost sense
        - "cost"
        - "costs"
        - "costo"
        - "costos"
        - "price"
        - "prices"
        - "precio"
        - "precios"
        - "input"
        - "inputs"
        - "insumo"
        - "insumos"
        - "commodity"
        - "commodities"
        - "raw"
        - "material"
        - "materials"
        - "materia"
        - "hedge"
        - "hedging"
        - "inflation"
        - "margin"
        - "margins"
        - "pressure"
      suppress_if_any:    # product/health/tax sense, not an input cost
        - "sugar free"
        - "no sugar"
        - "sin azucar"
        - "azucar reducida"     # ES "reduced sugar" — the product/health sense
        - "sugar sweetened"
        - "sugar tax"
        - "impuesto"            # ES tax — the excise/policy sense, not an input cost
        - "low sugar"
        - "reduced sugar"
        - "added sugar"
        - "zero sugar"
        - "less sugar"

