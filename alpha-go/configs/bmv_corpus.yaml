# Reproducible BMV coverage target for the general-purpose Alpha Go corpus.
#
# Each issuer must retain at least four usable quarterly filings. New documents come from the
# Bolsa Mexicana de Valores' official XBRL archive; the expansion script preserves the extracted
# filing HTML as the dashboard reader source and indexes a plain-text representation of it.
minimum_quarterlies: 4
# Product coverage contract. ``minimum_quarterlies`` remains the narrow XBRL-source gate; this
# broader target counts all accepted primary documents (quarterlies, annuals, events, releases).
target_companies: 50
target_documents_per_company: 50
# News is separately measured.  It never satisfies the primary-document target: a company needs
# its filings/official disclosures *and* an independent news set for a well-rounded corpus.
target_news_documents_per_company: 50
# Five annual reports per issuer is the target.  Official BMV XBRL currently satisfies it for
# most issuers; source-level coverage reports must expose shorter histories and route them to the
# issuer-IR/SEC fallback rather than silently lowering this number.
minimum_annuals: 5
# The BMV XBRL "annual" packages contain tagged facts but no narrative report text. They remain
# regulatory-source records; the annual-report gate stays disabled until issuer-IR/SEC PDF
# adapters materialize the five-year target. Coverage is still reported on every run.
minimum_annual_companies_bmv: 0
document_sources:
  - {key: bmv_xbrl, label: "BMV XBRL", kinds: [quarterly, regulatory_filing], priority: 10}
  - {key: bmv_issuer, label: "BMV issuer pages", kinds: [annual, relevant_event], priority: 15}
  - {key: issuer_ir, label: "Issuer investor relations", kinds: [annual, announcement], priority: 20}
  - {key: sec_edgar, label: "SEC EDGAR", kinds: [annual, regulatory_filing], priority: 30}
  - {key: upload, label: "Manual upload", kinds: [user_upload], priority: 40}
