# alpha-go top-level config — the local AlphaSense control file.
#
# `sources` reuses the vendored download config shape (mirrors the parent `ir_website`
# block) so the existing crawler/XBRL fetchers work unchanged. Per-company extraction
# tuning still lives in the vendored configs/<slug>.yaml files (used by the Financials panel).

# Certified corpus: the original six focus issuers plus ten locally mirrored issuers.  The
# local mirrors are copied into data/corpus at ingest, making the expanded artifact portable,
# reproducible, and independent of IR-site availability.
sources:
  - slug: walmex
    company: "Walmex"
    local_pdf_dir: ../data/reports/walmex
    # Preserve the canonical Markdown corpus while carrying every matching original PDF locally.
    local_md_only: true
    ir_website:
      url: https://www.walmex.mx/en/financial-information/quarterly.html
      pdf_link_pattern: '(?:reporte|report|trimest|quarter|result|earning).*\.pdf'
      xbrl_ticker: WALMEX
    # Annual/integrated reports live on a separate IR section; fetched with the annual selectors
    # (doc_kind="annual") into <YYYY>-FY periods. The governance-questionnaire and sustainability
    # PDFs on the same page are dropped automatically by the annual excluder.
    annual_reports:
      url: https://www.walmex.mx/en/financial-information/annual.html
      pdf_link_pattern: '(?:annual|integrated|informe).*\.pdf'
    doc_types: [release, report]
    language: en
    require_language: en
    industry: retail
    minimum_documents: 20

  - slug: bimbo
    company: "Grupo Bimbo"
    local_pdf_dir: ../data/reports/bimbo
    # Historical PDFs in the shared local mirror extend coverage back to 2002.  Reuse them
    # offline rather than re-downloading the same reports from the issuer site.
    doc_types: [report]
    language: en          # Bimbo publishes its quarterly releases in English
    industry: food
    minimum_documents: 20

  - slug: femsa
    company: "FEMSA"
    # English source = SEC EDGAR 6-K EX-99.1 earnings releases (reliable, no browser), fetched by
    # `scripts/onboard_edgar.py --slug femsa --cik 1061736`. No ir_website → ingest reuses the
    # markdown that script writes (FEMSA's own gcs-web IR site is JS-only and unreliable).
    edgar_cik: "1061736"
    doc_types: [release, report]
    language: en
    require_language: en
    industry: conglomerate
    minimum_documents: 20

  - slug: grupo_mexico
    company: "Grupo México"
    local_pdf_dir: ../data/reports/grupo_mexico
    # The shared local cache also contains 2018–2020 quarters; retain them for historical search.
    doc_types: [report]
    language: es
    industry: mining
    minimum_documents: 20

  - slug: fibra_uno
    company: "Fibra Uno"
    local_mdna_dir: ../soft/data/reports/fibra_uno/xbrl
    floor_year: 2021
    doc_types: [report]
    language: es
    industry: real_estate
    minimum_documents: 20

  - slug: banorte
    company: "Grupo Financiero Banorte"
    ir_website:
      url: https://investors.banorte.com/es/financial-information/quarterly-reports
      pdf_link_pattern: '(?:[1-4]T2[1-6][^/]*).pdf'
      floor_year: 2021
      max_reports: 30
    doc_types: [report]
    language: es
    industry: financials
    minimum_documents: 20

  # Expanded local corpus.  Each source points to the project's maintained report mirror rather
  # than crawling its IR website; this is deliberate so a rebuild can be repeated offline.
  - slug: chedraui
    company: "Grupo Chedraui"
    local_pdf_dir: ../data/reports/chedraui
    # Include the older PDF-only quarters already held in the shared local mirror.
    doc_types: [report]
    language: es
    industry: retail
    minimum_documents: 20

  - slug: herdez
    company: "Grupo Herdez"
    local_pdf_dir: ../data/reports/herdez
    doc_types: [report]
    language: es
    industry: food
    minimum_documents: 20

  - slug: kimber
    company: "Kimberly-Clark de México"
    local_pdf_dir: ../data/reports/kimber
    # 2021-3T is available only as an XBRL MD&A HTML filing; retain it as the original reader asset.
    local_original_html_dir: ../soft/data/reports/kimber/xbrl
    doc_types: [report]
    language: es
    industry: household_products
    minimum_documents: 20

  - slug: kof
    company: "Coca-Cola FEMSA"
    local_pdf_dir: ../data/reports/kof
    doc_types: [report]
    language: en
    industry: beverages
    minimum_documents: 20

  - slug: lab
    company: "Genomma Lab Internacional"
    local_pdf_dir: ../data/reports/lab
    doc_types: [report]
    language: es
    industry: healthcare
    minimum_documents: 20

  - slug: lacomer
    company: "La Comer"
    local_pdf_dir: ../data/reports/lacomer
    doc_types: [report]
    language: es
    industry: retail
    minimum_documents: 20

  - slug: liverpool
    company: "El Puerto de Liverpool"
    local_pdf_dir: ../data/reports/liverpool
    # The local mirror's Markdown set is the maintained report corpus; the remaining PDFs are
    # older archival variants that do not need to be reparsed during an index rebuild.
    local_md_only: true
    doc_types: [report]
    language: es
    industry: retail
    minimum_documents: 20

  - slug: soriana
    company: "Organización Soriana"
    local_pdf_dir: ../data/reports/soriana
    doc_types: [report]
    language: en
    industry: retail
    minimum_documents: 20

  - slug: sport
