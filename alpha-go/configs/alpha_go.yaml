# --- Index settings (Phase 2/3) -------------------------------------------------------
index:
  db_path: data/index/alpha_go.db
  strict_runtime: true          # fail loudly if the certified local model is unavailable/mismatched
  embedding_backend: auto          # auto | hashing | sentence-transformers
                                #   auto: use sentence-transformers if installed,
                                #         else fall back to the offline HashingEmbedder
  # Multilingual MiniLM (384-dim): reports are English but users query in Spanish
  # ("porcentaje de ventas y costos de europa"). This model matches a Spanish query against
  # English report text (ES full-query → EAA prose: 0.26 → 0.37 vs the English-only model).
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2  # ST backend
  embedding_batch_size: 512  # small checkpoints balance heterogeneous financial-document chunks
  # Benchmarked on the target 8-core Mac: larger transformer batches thrash memory and are
  # dramatically slower. Four CPU threads + 16 texts/model batch sustains ~35 corpus chunks/s.
  embedding_inner_batch_size: 16
  embedding_cpu_threads: 4
  embedding_migration_workers: 8  # one isolated worker per logical core; higher counts add no throughput
  embedding_migration_worker_threads: 1
  chunk:
    target_chars: 1200
    overlap_chars: 150
  expand_synonyms: true        # reuse configs/metric_search.yaml alias dictionary

# --- Search defaults (Phase 3) --------------------------------------------------------
# Semantic-forward: concept/meaning ranking is the primary surface (users search ideas, not
# verbatim strings). Keyword still contributes to fusion and drives the exact-mention count.
search:
  default_limit: 20
  keyword_weight: 0.3
  semantic_weight: 0.7

# --- Document-type taxonomy (AlphaSense-style scoping) --------------------------------
# Canonical doc types with friendly labels + filename/text keywords used to infer a type at
# ingest/upload. First entry whose keyword appears wins; otherwise `default_doc_type`. Legacy
# index values release/report map to "Quarterly release" (see src/corpus/doc_types.py::_LEGACY).
default_doc_type: quarterly_release
doc_types:
  - key: news_article
    label: News
    keywords: []
  # Listed before quarterly_release so a true press release wins over the generic `release`
  # keyword. Keywords use the space/hyphen/underscore forms real filenames take (the bare token
  # `press` is avoided — it would false-match `express`).
  - key: press_release
    label: Press release
    keywords: [comunicado, prensa, boletin, "press release", "press-release", "press_release", news release]
  - key: quarterly_release
    label: Quarterly release
    keywords: [release, quarter, trimestr, earnings, resultados, 1q, 2q, 3q, 4q, 1t, 2t, 3t, 4t]
  - key: annual_report
    label: Annual report
    keywords: [annual, "10-k", "20-f", informe anual, integrated report, reporte anual, anual]
  - key: transcript
    label: Earnings-call transcript
    keywords: [transcript, transcripcion, earnings call, conference call, webcast]
  - key: presentation
    label: Investor presentation
    keywords: [presentation, presentacion, investor day, slides, deck]
  - key: analyst_research
    label: Analyst / sector research
    keywords: [equity research, analyst report, initiation, initiating coverage, price target, rating]
  - key: relevant_event
    label: Relevant / material event
    keywords: [evento relevante, hecho relevante, material event]
  - key: shareholder_meeting
    label: Shareholder meeting
    keywords: [asamblea, shareholder meeting, annual general meeting]
  - key: debt_prospectus
    label: Debt / prospectus
    keywords: [prospectus, prospecto, deuda, debt offering]
  - key: sustainability_report
    label: Sustainability report
    keywords: [sustainability, sustentabilidad, esg report, informe integrado]
  - key: regulatory_filing
    label: Regulatory filing
    keywords: [filing, "6-k", "8-k", folleto, cnbv, bmv, sec]
  - key: internal
    label: Internal / Other
    keywords: []

# --- Sentiment (Phase 4) — lexicon by default; optional LLM refine (DeepSeek) ---------
# engine: lexicon = offline word-list only (hermetic, no key needed).
#         hybrid  = lexicon by default, LLM-refine the occurrences actually shown on screen
#                   (auto-on-visible), disk-cached under .llm_cache/sentiment/.
#         llm     = same as hybrid (lexicon is always the fallback when the LLM is unreachable).
# The provider key is read from the env var named by api_key_env (put it in a gitignored .env).
# Sentiment tone of a matched passage. Default = offline lexicon (deterministic, hermetic).
# The opt-in LLM tier scored acc 0.91 / macro-F1 0.915 on the held-out test vs the lexicon's
# 0.755 / 0.693 — flip engine to `llm` (or `hybrid`) to enable it. Needs the provider key
# (DEEPSEEK_API_KEY in .env) and `openai>=1.0`; results are disk-cached under .llm_cache/sentiment/.
sentiment:
  engine: lexicon          # lexicon (offline default) | llm | hybrid
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  cache: true

# --- Q&A synthesis (Phase 5) — OFF by default; the only generative feature -----------
# provider: deepseek (OpenAI-compatible). Switch to anthropic (+ api_key_env) if desired.
qa:
  enabled: false
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  top_k: 8

# --- Smart Summaries (Phase 7) — extractive "key takeaways" by default; optional LLM tier -----
# engine: extractive = offline, deterministic sentence-selection (salience + MMR). No key needed.
#         hybrid / llm = hand the extractively-selected sentences to the provider for a tight
#                        bulleted takeaways narrative with [n] citations; disk-cached under
#                        .llm_cache/summary/. Falls back to the extractive summary if unreachable.
# max_sentences bounds both the extractive bullets and the passages fed to the LLM tier.
summary:
  engine: extractive       # extractive (offline default) | llm | hybrid
  max_sentences: 6
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  cache: true
