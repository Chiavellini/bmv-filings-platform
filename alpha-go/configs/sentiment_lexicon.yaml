# ============================================================ CONTEXT GUARDS
# High-precision phrase guards (matched on the accent-folded, lowercased FULL text) that fix the
# systematic false-fires of a bag-of-cues scorer on earnings prose. Kept deterministic/offline.
#
#   neutral_domains  — valence-free domains (accounting policy, IFRS/notes methodology, hedging &
#                      risk-management objectives, share/dividend mechanics, education/training CSR).
#                      A match forces NEUTRAL: cue words here ("perdida", "crecimiento", "higher")
#                      are terminology, not tone.
#   offset_markers   — "partially offset by" / "compensado por": the offsetting clause is
#                      subordinate, so the DOMINANT prior clause's sign wins (cues after the marker
#                      are dropped when the head clause already carries a cue).
#   forward_markers  — future-modal optimism ("will continue to drive", "permitira el crecimiento").
#                      Combined with the engine's no-concrete-evidence check, VAGUE forward-looking
#                      optimism reads neutral while CONCRETE optimism (numbers, record, savings) stays
#                      positive — matching the gold rubric.
guards:
  en:
    neutral_domains:
      - amortized cost
      - fair value
      - share-based payment
      - strike price
      - shares outstanding
      - weighted average strike
      - net settlement
      - exchange rate published
      - exchange rate of
      - comprehensive income
      - equity method
      - intercompany
      - honorary directors
      - academic
      - students
      # executive bios / board composition — a career summary is not company tone
      - biography
      - his career
      - her career
      - serving as
      # CSR / policy commitments — aspirational, non-tonal ("our commitment to ...")
      - our commitment to
      - reaffirm our commitment
      - responsible marketing
    positive_domains:
      # award / recognition PR — good-news domains that otherwise land neutral or negative
      - was recognized
      - were recognized
      - recognized as
      - recognized by
      - recognized among
      - recognized with
      - a recognition
      - award
      - awarded
      # expansion — store / distribution-center openings read positive per the gold rubric
      - new distribution center
      - new stores
    offset_markers:
      - offset by
      - compensated by
      - counterbalanced by
      - impacted by
      - but with
    concession_markers:
      - despite
      - although
      - even though
    forward_markers:
      - will continue
      - will drive
      - will deliver
      - we are confident
      - confident that
      - confident we
      - look forward
      - positioned to
      - committed to
      - expect to
      - aim to
      - poised to
      - drive sustainable
      - upside
  es:
    neutral_domains:
      - se reconoce
      - se reconocen
      - costo amortizado
      - valor razonable
      - politicas contables
      - estimaciones contables
      - tasa de interes efectiva
      - impuesto diferido
      - impuestos a la utilidad
      - diferencias temporales
      - metodo de adquisicion
      - obligaciones de desempeno
      - minimizar el riesgo
      - administrar y controlar
      - optimizar la rentabilidad
      - swaps de tasa
      - fondo de recompra
      - capital social
      - acciones ordinarias
      - horas de capacitacion
      - capacitacion
      - bachillerato
      - alumnos
      # accounting-method / recording explanations (IFRS lease treatment, etc.) — not tone
      - manera de registrar
      - forma de registrar
      # procurement / payment-terms mechanics (accounts-payable normalization) — not tone
      - cuentas por pagar
    positive_domains:
      # award / recognition PR
      - fue reconocid
      - fue reconocida
      - reconocido como
      - reconocida como
      - reconocido por
      - reconocida por
      - galardon
      - premiad
      - distincion
      # ranked among the best-performing (ESG / reputation rankings)
      - mejor desempeno
      # expansion — store openings read positive per the gold rubric
      - aperturas de tiendas
      - apertura de tiendas
      - nuevas tiendas
    offset_markers:
      - compensado por
      - compensada por
      - compensados por
      - compensadas por
      - contrarrestado por
      - contrarrestada por
      - contrarrestados por
      - contrarrestadas por
      - pero con
    concession_markers:
