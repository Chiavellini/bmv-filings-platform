# Bilingual financial-tone lexicon for the offline sentiment pass (src/qa/sentiment.py).
# Deterministic and dependency-free. The engine auto-detects the passage language and applies
# the matching section (much of the corpus is Spanish; English-only scoring read it neutral).
#
# Two mechanisms per language:
#   1. Inherently-valenced words (positive / negative) count as-is.
#   2. DIRECTIONAL words (increase / decline / crecio / cayo…) take their polarity from the
#      NEAREST OBJECT nearby: "increase in the excise tax" is negative (up + negative_object),
#      "reduced costs" is positive (down + negative_object), "revenue increased" is positive.
#      With no object nearby, the direction's own sign applies.
# Negators flip the resulting polarity within a short window ("no pressure" / "sin presion").
#
# Matching is accent-folded and lowercased: write words WITHOUT accents ("presion", "caida",
# "utilidad") — the tokenizer folds "presión"/"caída" to the same key before lookup.
# Tuned for earnings-report prose, not general sentiment. Extend freely within each section.

