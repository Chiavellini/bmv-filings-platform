# analog_queries — a PRECISION-oriented stress set for the analog synonym-expansion feature.
#
# WHY THIS EXISTS
# ---------------
# eval/queries.yaml (scored by scripts/eval_retrieval.py) is a RECALL guard: it only asks
# whether a top-k hit is the right COMPANY. With a 3-company corpus already saturated at
# recall@5 = 100%, it STRUCTURALLY cannot see the two risks analog expansion actually adds:
#   1. NOISE — irrelevant passages pulled in by a fired analog concept.
#   2. POLYSEMY FALSE-FIRES — a wrong-sense query ("pet food", "frying pan") over-expanding
#      into the domain sense (resin/plastic, bakery bread).
# This file is built to MOVE those numbers, not to pass trivially.
#
# KIND TAGS
#   trap_wrong — the OTHER-sense query for a documented polysemy trap. The gate in
#                configs/analogs.yaml (suppress_if_any / require_any) must keep it from
#                expanding. Target: it surfaces ZERO wrong-sense analog hits.
#   trap_right — the domain-sense partner of the same trap. The gate must STILL fire it
#                (corroborating co-terms present). Target: it expands correctly.
#   base_miss  — a paraphrase/analog query whose target passage the BASE (expand_synonyms=False)
#                keyword system MISSES, so analog expansion is the only keyword path to it.
#                Every base_miss below was verified to miss without expansion (see the collector's
#                `base_literal_miss` field in the candidates file); new base_miss rows also carry a
#                declared `base_literal_miss: true` tag confirmed with expand_synonyms=False.
#
# SPLIT TAGS  (added track-b-expand2)
#   Every query carries `split: tuning|heldout`. HELDOUT is reserved so the rerank / gate can be
#   tuned on `tuning` and REPORTED on `heldout` it never saw — the standard train/test hygiene.
#   The split is STRATIFIED by `kind` (~60/40) so both halves cover trap_wrong/trap_right/base_miss;
#   a polysemy pair (the trap_wrong + its trap_right partner) is kept in the SAME split so the pair
#   is always evaluated together. Composition:
#     tuning : trap_wrong 9, trap_right 9, base_miss 12  = 30
#     heldout: trap_wrong 6, trap_right 6, base_miss  8  = 20
#
# `concept` names the analogs.yaml concept the query targets. `expect_company` is a REFERENCE
# hint for the human/independent judge (which filer holds the domain passage) — it is NOT an
# auto-scored label; relevance is filled into eval/analog_relevance.yaml by a separate judge.
# New rows (this batch) carry `added_in: track-b-expand2` so the collector can target them with
# `--only-new` and write eval/analog_candidates2_unlabeled.yaml.
#
# NOTE: This set was authored as infrastructure only. No analogs.yaml weight/gate was tuned and
# no relevance was self-judged while building it.
version: 1

