note: >
  Independently-authored salient-fact gold for Smart Summaries (scripts/eval_summary.py).
  For each target, `salient_facts` are the must-include facts a reader deemed important, authored
  from the SOURCE document (never from the extractor's output — no tuning on this set).
  coverage@N = fraction of a target's salient_facts whose content tokens appear in the extractive
  top-N sentences; boilerplate-rate = fraction of selected sentences flagged boilerplate (target 0).
  `split: heldout` rows must NEVER be tuned against — mint a fresh held-out set each round.

  SEED SET: the two entries below are authored against the in-repo ACME fixture so the harness
  scores end-to-end with no external index. Add real company/period targets (walmex/bimbo/femsa)
  pointing `corpus:` at data/corpus and `file:` at <slug>/<period>.md once those docs are read.
corpus: tests/fixtures/sample_corpus
max_sentences: 4
targets:
  - slug: acme
    period: 2024-1T
    file: acme/acme_1Q24.md
    split: tuning
    salient_facts:
      - "Total revenues reached 1,250.0, up 8.3% year over year"
      - "EBITDA finalized at 230.0 with a margin of 18.4%"
      - "Pricing pressure from e-commerce competitors in Mexico"

  - slug: acme
    period: 2024-2T
    file: acme/acme_2Q24.md
    split: heldout
    salient_facts:
      - "Total revenues reached 1,310.0, up 6.1% year over year"
      - "Same-store sales grew 4.2% as traffic recovered across formats"
      - "EBITDA finalized at 245.0 with a margin of 18.7%"
