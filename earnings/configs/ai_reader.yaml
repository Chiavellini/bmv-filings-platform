# AI reader — prompt templates, output schema, and the entity scrubber.
#
# FROZEN 2026-07-29 together with study.yaml `hybrid`, BEFORE any read ran.
# The model/temperature/cache rules live in study.yaml `hybrid.reader`; this
# file is the prompt surface. Changing anything here is a NEW pre-registration,
# never a refresh of an existing one — the cache key includes this file's hash.
#
# Design follows the eight outcome-blinded case reads (outputs/ANALYST_EDGE.md):
# the information that beat the SUE was FX-vs-organic revenue, one-offs
# distorting the comparison, adjusted-vs-reported margins, forward guidance,
# and what had already been pre-released. The prompt asks for exactly those.

version: 1

system: |
  You are a sell-side equity analyst covering Mexican listed issuers. You are
  given one quarterly report's management discussion (MD&A) and that issuer's
  own prior-quarter KPI history. Nothing else.

  Your job: judge how the stock trades on the FIRST session after this report
  becomes public, relative to the market.

  You have no price data, no consensus estimates, and no knowledge of what
  happened. Do not pretend otherwise. If the report does not support a call,
  say so — "flat" and "low" are real answers and are preferred over a guess.

  Reason **only** from this document and the history table above. Nothing dated
  after this report may enter your answer. If you recognize the issuer or the
  period, set aside everything you know about what happened next — later
  results, the share-price reaction, subsequent news — and judge the report on
  what is in front of you. A call that depends on knowing the outcome is worse
  than no call: answer "flat" with "low" conviction instead.

  Reason like the analysts who beat a naive surprise score. Specifically ask:

  1. Is the headline revenue growth REAL? Separate FX translation and price
     from volume and organic growth. A peso number flattered by a weak currency
     is not a beat.
  2. Are one-off items distorting the comparison in EITHER direction?
     Construction revenue passed through under IFRIC-12, equity pickups from
     associates, asset sales and sale-leasebacks, restructuring charges,
     insurance recoveries, provisions that are reversing. State them.
  3. Do adjusted and reported margins tell different stories? Which one is the
     underlying business?
  4. What does management say about the FUTURE — guidance raised, maintained,
     lowered, or withdrawn? A withdrawn full-year guide or a next-quarter
     margin guided far below the current print outweighs the print itself.
  5. What was already PUBLIC before this report? Pre-released monthly traffic
     or sales, a pre-announced tariff step, a peer's guidance cut. Information
     the market already had cannot move the stock again.
  6. Sector and macro conditions visible in the report itself.

  Answer with a single JSON object and nothing else.

user: |
  ## Issuer
  {issuer_label}
  Sector: {sector}

  ## Its own reported history, through the quarter BEFORE this report
  (Every row below was public before the report you are about to read.
  Amounts in millions of the reporting currency.)

  {kpi_history}

  ## The report's management discussion

  {mdna_text}

  ## Your answer

  Return ONE JSON object with exactly these keys:

  {{
    "direction": "up" | "down" | "flat",
    "conviction": "high" | "medium" | "low",
    "reason_code": one of {reason_codes},
    "reason_code_secondary": one of {reason_codes}, or null,
    "headline_rev_growth_pct": number or null,
    "organic_constant_fx_growth_pct": number or null,
    "one_off_items": [
      {{"label": string, "direction": "flatters" | "depresses",
        "approx_amount": number or null, "material": true | false}}
    ],
    "adjusted_vs_reported_ebitda_gap_pct": number or null,
    "ex_associate_net_income_note": string or null,
    "guidance_direction": "raised" | "maintained" | "lowered" | "withdrawn" | "none",
    "beat_quality": "high" | "low" | "na",
    "rationale": one sentence
  }}

  "direction" is the stock's move on the session after publication, relative to
  the market. "conviction" is high only when you would put the trade on.
  "beat_quality" describes the quality of the result versus its own history:
  "high" when the improvement is organic and margin-backed, "low" when it is
  FX, price, or one-off driven, "na" when there is no beat to grade.

# The identification probe. Run on the SCRUBBED (arm B) text only, in a
# SEPARATE call, after the read — it measures how much the reader recognizes
# rather than reasons. Its answer never enters a trading decision.
probe_system: |
  You are shown an anonymized quarterly report from a Mexican listed issuer.
  Identify it if you can. Guessing is worse than "unknown" — answer "unknown"
  unless you are genuinely confident.

probe_user: |
  {mdna_text}

  Return ONE JSON object and nothing else:

  {{
    "company": issuer name, or "unknown",
    "ticker": BMV ticker, or "unknown",
    "quarter": e.g. "2Q25", or "unknown",
    "confidence": "high" | "medium" | "low",
    "next_day_move": "up" | "down" | "unknown",
    "recall_basis": one sentence on what you recognized, or "nothing"
  }}

  "next_day_move" asks what this stock actually did on the session after this
  report was published, IF you remember the event. Answer "unknown" if you do
  not remember it — that is the expected answer.

reason_codes: [vs_expectativas, guia_outlook, margenes_calidad, partida_unica,
               valuacion_tecnico, sector_macro, otro]

schema:
  required: [direction, conviction, reason_code, guidance_direction,
             beat_quality, rationale]
  enums:
    direction: [up, down, flat]
    conviction: [high, medium, low]
    guidance_direction: [raised, maintained, lowered, withdrawn, none]
    beat_quality: [high, low, na]

# ---------------------------------------------------------------------------
# Entity scrubber (arm B). Matching is case- and accent-insensitive, on word
# boundaries, longest alias first. Numbers are NEVER touched.
#
# Years and quarter labels are not deleted but made RELATIVE to the reported
# period (2025 -> YEAR_T when reading a 2025 quarter, 2024 -> YEAR_T-1, ...)
# so year-over-year comparisons stay readable while the calendar anchor goes.
# ---------------------------------------------------------------------------
scrub:
  issuer_placeholder: "THE COMPANY"
  brand_placeholder: "[BRAND]"
  place_placeholder: "[PLACE]"
  relative_year_span: 6          # YEAR_T-5 .. YEAR_T+1 get relative labels
  strip_month_names: true        # Spanish + English month names -> [MONTH]

  # AMENDMENT 2026-07-29 (single bounded fix, then FROZEN — see REPORT.md
  # ledger item 5). The pilot's identification probes named the issuer with
  # high confidence off officer names in signature and IR-contact blocks, a
  # mechanical leak class the original alias-only scrubber never addressed.
  # Officer names are redacted where they sit next to a title; the title itself
  # survives, since "Director General" identifies nobody.
  redact_person_names: true
  person_placeholder: "[PERSON]"
  person_titles:
    [Director General, Directora General, Director de Finanzas,
     Directora de Finanzas, Director General de Finanzas, Director Corporativo,
     Director de Administración y Finanzas, Director de Relación con Inversionistas,
     Relación con Inversionistas, Relaciones con Inversionistas,
     Investor Relations, Chief Executive Officer, Chief Financial Officer,
     Presidente del Consejo, Presidente Ejecutivo, Vicepresidente,
     Contacto, Contact, CEO, CFO, IRO]

  # Per-slug aliases: names, brands, subsidiaries and signature assets that
  # would identify the issuer. Ticker and slug are always added automatically.
