# Golden reference ranges for the reconciliation workflow (src/coverage/reconcile.py).
#
# Hand-set APPROXIMATE public ranges for large, liquid BMV names. Purpose: a deterministic,
# network-free backstop that catches GROSS calculation errors (2x / 10x / currency / scale) — NOT a
# precision audit. Ranges are deliberately WIDE so a genuinely-correct value never false-flags; the
# live Yahoo oracle (Layer 2) does the tight per-name cross-check. Keyed by the master's Company
# name (== outputs/<Name>/ folder). shares_out in millions; pe is a multiple; net_margin/roe in %.
# Omit a field (leave it out) when the metric is structurally volatile for that name.

Walmex:
  clave: WALMEX
  shares_out_mn: [16000, 18500]
  pe: [15, 34]
  net_margin: [3.5, 8]
  roe: [15, 35]

