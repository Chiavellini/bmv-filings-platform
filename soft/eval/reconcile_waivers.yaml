# Reconciliation waivers — explicit, human-reviewed suppressions for findings that are NOT our bug
# and that the auto-noise rules in reconcile._oracle_kind can't infer. A waived finding is downgraded
# to kind="expected" (dropped from the Actionable list, kept in the Suppressed summary for audit).
#
# Schema:  <Company display name>:
#            metrics: [<Metric>, ...]   # exact Metric strings as they appear in the report
#            reason:  <one line — WHY this is not an actionable defect>
#
# Keep this list SHORT and evidence-backed. Do NOT waive a finding just to make the count go down —
# a genuine scale/shares/currency defect must stay 'real' so the book scorecard flags it RED.
# The auto-rules already suppress: Yahoo absolute share/market-cap disagreements, and Yahoo's
# garbage EV/EBITDA & P/E denominators — so those do NOT need entries here.

