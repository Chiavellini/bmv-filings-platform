      label: Consumer Products revenue
      label_es: Productos al consumidor
      section: income
      unit: currency
      patterns:
      - regex: ^Productos al consumidor[^\S\r\n]+[\d,]+[^\S\r\n]+[\d,]+[^\S\r\n]+[\d,]+[^\S\r\n]+([\d,]{7,})$
        source: table
        multiplier: 1.0e-06
    - key: revenue_exports
      label: Export revenue
      label_es: Productos de exportación
      section: income
      unit: currency
      patterns:
      - regex: ^Productos de exportaci[oó]n[^\S\r\n]+[\d,]+[^\S\r\n]+[\d,]+[^\S\r\n]+[\d,]+[^\S\r\n]+([\d,]{7,})$
        source: table
        multiplier: 1.0e-06
    - key: consumer_yoy
      label: Consumer segment YoY growth
      section: income
      unit: pct
      patterns:
      - regex: Productos\s+al\s+Consumidor\s+creci[óo]\s+([\d.]+)\s*%
        source: prose
        multiplier: 1.0
      - regex: Productos\s+al\s+Consumidor\s+decreci[óo]\s+([\d.]+)\s*%
        source: prose
        multiplier: -1.0
      - regex: Consumer\s+and\s+Away\s+from\s+Home\s+increased\s+([\d.]+)\s*%
        source: prose
        multiplier: 1.0
      - regex: Consumer\s+and\s+Away\s+from\s+Home\s+decreased\s+([\d.]+)\s*%
        source: prose
        multiplier: -1.0
    - key: afh_yoy
      label: Away from Home YoY growth
      section: income
      unit: pct
      patterns:
      - regex: Away\s+from\s+Home\s+creci[óo]\s+([\d.]+)\s*%
        source: prose
        multiplier: 1.0
      - regex: Away\s+from\s+Home\s+decreci[óo]\s+([\d.]+)\s*%
        source: prose
        multiplier: -1.0
      - regex: Consumer\s+and\s+Away\s+from\s+Home\s+increased\s+[\d.]+%\s+and\s+([\d.]+)\s*%
        source: prose
        multiplier: 1.0
      - regex: Consumer\s+and\s+Away\s+from\s+Home\s+decreased\s+[\d.]+%\s+and\s+([\d.]+)\s*%
        source: prose
        multiplier: -1.0
