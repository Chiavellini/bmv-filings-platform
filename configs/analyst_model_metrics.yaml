        source: table
      - regex: (?:Ventas\s+netas|Ingresos)\s+por\s+categor[ií]a\s+\dT\s?\d{2}[\s\S]{0,500}?Jos[eé]\s+Cuervo\s+([\d,]+)\s+([\d,]+)
        source: table
    - key: revenue_other_tequilas
      label: Net Sales Other Tequilas
      label_es: Ventas netas Otros Tequilas
      section: segment
      unit: currency
      patterns:
      - regex: Net\s+Sales\s+by\s+Category\s+\dQ\s?\d{2}[\s\S]{0,750}?Other\s+Tequilas\s+\$?\s*([\d,]+)\s+\$?\s*([\d,]+)
        source: table
      - regex: (?:Ventas\s+netas|Ingresos)\s+por\s+categor[ií]a\s+\dT\s?\d{2}[\s\S]{0,750}?Otros\s+Tequilas\s+([\d,]+)\s+([\d,]+)
        source: table
    - key: revenue_other_spirits
      label: Net Sales Other Spirits
      label_es: Ventas netas Otros Spirits
      section: segment
      unit: currency
      patterns:
      - regex: Net\s+Sales\s+by\s+Category\s+\dQ\s?\d{2}[\s\S]{0,950}?Other\s+Spirits\s+\$?\s*([\d,]+)\s+\$?\s*([\d,]+)
        source: table
      - regex: (?:Ventas\s+netas|Ingresos)\s+por\s+categor[ií]a\s+\dT\s?\d{2}[\s\S]{0,950}?Otros\s+(?:Spirits|Espirituosos)\s+([\d,]+)\s+([\d,]+)
        source: table
    - key: revenue_rtd
      label: Net Sales RTD
      label_es: Ventas netas RTD
      section: segment
      unit: currency
      patterns:
      - regex: Net\s+Sales\s+by\s+Category\s+\dQ\s?\d{2}[\s\S]{0,1200}?RTD\s+\$?\s*([\d,]+)\s+\$?\s*([\d,]+)
        source: table
      - regex: (?:Ventas\s+netas|Ingresos)\s+por\s+categor[ií]a\s+\dT\s?\d{2}[\s\S]{0,1200}?RTD\s+([\d,]+)\s+([\d,]+)
