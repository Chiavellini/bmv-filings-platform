    - key: amp_expenses
      label: AMP expenses
      section: income
      unit: currency
      patterns:
      - regex: ^\s*Advertising,\s+marketing\s+and\s+promotion\s+\(?-?[\d,]+(?:\.\d+)?\)?\s+(\(?-?[\d,]+(?:\.\d+)?\)?)(?=\s|$)
        source: table
    - key: distribution_expenses
      label: Distribution expenses
      section: income
      unit: currency
      patterns:
      - regex: ^\s*Distribution\s+\(?-?[\d,]+(?:\.\d+)?\)?\s+(\(?-?[\d,]+(?:\.\d+)?\)?)\s+\d
        source: table
    - key: other_income_net
      label: Other (income), net
