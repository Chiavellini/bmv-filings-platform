      # setting it to 2025 hid cemex's 14 pre-2025 MD&A periods and dropped
      # reported coverage from 20 to 6. The template simply misses on older
      # periods, which costs one HEAD request each.
      url: https://www.cemex.com/investors/reports/quarterly-reports
      max_reports: 120
      delay_ms: 500
      xbrl_ticker: CEMEX
      direct_url_templates:
        - https://www.cemex.com/documents/d/cemex/{quarter}q{year2}-report-eng
