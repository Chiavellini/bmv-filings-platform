  cemex:
    name: CEMEX
    market_ticker: CEMEXCPO
    language: en
    unit: millions
    ir:
      # The index page enumerates only the current quarter, so static discovery
      # stalls at `needs_second_sample`. Document URLs are deterministic and
      # extensionless (`_verify_pdf_url` confirms them by magic bytes):
      # 2026-2T/1T and 2025-4T/3T verified 2026-08-04; 2024-2T 404s, so this
      # naming scheme only goes back so far. Deliberately NO floor_year: that
