# Segments-sheet outline spec for WALMEX.
#
# Consumed by segments_sheet.generate_company_segments():
#   - `outline`  : the metric list verbatim (section headers, data rows, and
#                  computed rows). parse_outline() classifies each line.
#   - `sections` : exact header lines that are GROUP TITLES (not data). Needed
#                  to disambiguate labels like "Mexico" that are a section in
#                  one place and a data row in another.
#   - `mapping`  : data-row label -> extractor metric key. Use "Section/Label"
#                  to disambiguate repeated sub-labels (e.g. Gross Profit/Mexico
#                  vs EBITDA/Mexico). Unmapped rows render blank (no data yet).
#
# Computed rows (YoY, Check, Margin, bps change, 2-year comp, As % of …) are
# never extracted — they become Excel formulas or label-only placeholders.

title: "WALMEX: Walmart de México y Centroamérica"
units: "P$mn"

sections:
  - Revenues
  - Mexico
  - Central America
  - Sales per m2
  - Stores
  - New Total Stores
  - Net New Stores Mexico (quarter)
  - Net New Stores CAM (quarter)
  - Sales Floor (m2)
  - Profitability
  - Gross Profit
  - Operating Income
  - EBITDA

# label (or Section/label) -> extractor metric key
mapping:
  "Walmart de México y CAM": revenue
  "Merchandise": net_sales
  "Total MX Sales": revenue_mexico
  "MX SSS YoY": sss_mexico
  "Ticket": ticket_mexico
  "Traffic": traffic_mexico
  "e-Commerce": ecommerce_gmv_growth
  "Total CAM Sales": revenue_cam
  "CAM SSS YoY": sss_cam
  "Total Stores": total_stores
  "Total Stores Mexico": total_stores_mexico
  "Total Stores CAM": total_stores_cam
  "Sales Floor (m2)/Area Mexico": sales_floor_mexico
  "Area Central America": sales_floor_cam
  "Gross Profit/Consolidated": gross_profit
  "Gross Profit/Mexico": gross_profit_mexico
  "Gross Profit/Central America": gross_profit_cam
  "Consolidated Operating Income": operating_income
  "MX - Operating Income": operating_income_mexico
  "CAM - Operating Income": operating_income_cam
  "EBITDA/Consolidated": ebitda
  "EBITDA/Mexico": ebitda_mexico
  "EBITDA/Central America": ebitda_cam

