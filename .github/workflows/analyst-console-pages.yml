name: Publish Analyst Launchpad

on:
  push:
    branches: [main]
    paths:
      - "src/analyst_console/static/**"
      - ".github/workflows/analyst-console-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: analyst-launchpad-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package launchpad
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/analyst_console/static
      - name: Publish launchpad
        id: deployment
        uses: actions/deploy-pages@v4
