name: Airflow downloader

on:
  pull_request:
    paths:
      - ".github/workflows/airflow-native.yml"
      - "configs/**"
      - "deploy/airflow/**"
      - "requirements/acquisition-worker.txt"
      - "requirements/airflow-native.txt"
      - "scripts/configure_airflow.py"
      - "scripts/install_airflow_native.sh"
      - "src/acquisition/**"
      - "src/consumers/**"
      - "src/deployment/airflow_task.py"
      - "src/download/**"
      - "src/shared/**"
      - "tests/test_airflow_deployment.py"
      - "tests/test_acquisition_registry.py"
      - "tests/test_acquisition_to_alpha_e2e.py"
      - "tests/test_alpha_go_consumer.py"
      - "tests/test_consumer_outbox.py"
      - "tests/test_quarterly_acquisition.py"
      - "estate.json"
      - "estate_bridge.py"
      - "pyproject.toml"
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.ci/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/deploy/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PDFS_DOCUMENT_ESTATE: ${{ github.workspace }}/.ci/estate
      PDFS_PROJECT_ROOT: ${{ github.workspace }}
      PDFS_AIRFLOW_PYTHON: python3.13
      PDFS_AIRFLOW_VENV: ${{ github.workspace }}/.ci/airflow-venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"
          cache: pip
      - run: scripts/install_airflow_native.sh
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/python" -m pip install
          --disable-pip-version-check
          "apache-airflow==3.3.0"
          -e ".[test]"
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/python" -m pip check
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/python" -m pytest -q
          tests/test_airflow_deployment.py
          tests/test_acquisition_registry.py
          tests/test_acquisition_to_alpha_e2e.py
          tests/test_alpha_go_consumer.py
          tests/test_consumer_outbox.py
          tests/test_quarterly_acquisition.py
      - run: mkdir -p "${PDFS_DOCUMENT_ESTATE}"
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/airflow" db migrate
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/airflow"
          dags list --local --output plain
      - run: >-
          test "$("${PDFS_AIRFLOW_VENV}/bin/airflow"
          dags list --local --output plain | grep -c '^quarterly_estate_')" -eq 4
      - run: >-
          "${PDFS_AIRFLOW_VENV}/bin/airflow"
          dags list-import-errors --local --output json
